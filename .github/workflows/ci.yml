name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  worker-http:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Worker HTTP retry and diagnostic tests (local fixtures only)
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_worker_request.py' -v
      - name: Discord command registration safety (offline)
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/discord -p 'test_*.py' -v

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --no-fail-fast
      - run: cargo run --quiet -p prosepect-api --bin export-openapi > /tmp/openapi.json
      - name: Preserve generated API contract
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openapi-export
          path: /tmp/openapi.json
          if-no-files-found: error
          retention-days: 3
      - run: diff -u openapi/openapi.json /tmp/openapi.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check:web
      - run: npm run typecheck:web
      - run: npm run lint:web
      - run: npm run test:web
      - run: npm run build:web
      - run: npm run generate:api --workspace @rakkio/web
      - run: git diff --exit-code -- apps/web/src/api/schema.d.ts

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: docker compose config --quiet
      - run: docker compose build
      - name: Static Caddy indexing responses (disposable runner only)
        run: |
          docker compose run --rm --no-deps --entrypoint caddy web validate --config /etc/caddy/Caddyfile
          trap 'docker compose down --remove-orphans' EXIT
          docker compose up -d --no-deps web
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 1 --max-time 60 http://127.0.0.1:8080/ > /tmp/public-home.html
          python3 - <<'PY'
          import urllib.request, urllib.error
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args): return None
          client=urllib.request.build_opener(NoRedirect)
          def check(path, status):
              try: response=client.open('http://127.0.0.1:8080'+path, timeout=10)
              except urllib.error.HTTPError as error: response=error
              assert response.code==status, (path,response.code,status)
              return response.headers,response.read().decode()
          for path in ['/', '/privacy', '/terms', '/delete-account']:
              headers,body=check(path,200)
              assert 'rel="canonical" href="https://rakkio.com'+path+'"' in body
              assert '<h1' in body
          for path in ['/settings', '/groups/00000000-0000-0000-0000-000000000001/assignments']:
              headers,body=check(path,200)
              assert headers['X-Robots-Tag']=='noindex, nofollow'
              assert 'rel="canonical"' not in body
          for path in ['/home','/home/','/delete-account.html']:
              check(path,308)
          for path in ['/blog.html','/missing-page']:
              headers,body=check(path,404)
              assert 'Page not found' in body
              assert headers['X-Robots-Tag']=='noindex, nofollow'
          headers,body=check('/robots.txt',200)
          assert 'text/plain' in headers['Content-Type'] and 'Sitemap:' in body
          headers,body=check('/sitemap.xml',200)
          assert '<urlset' in body and 'xml' in headers['Content-Type']
          print('Native Caddy HTTP indexing contract passed.')
          PY

  personal-self-hosting:
    # Backend includes the actual lock-backed one-account registration cap test.
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Personal packaging safety tests (no Docker)
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/personal -p 'test_*.py' -v
      - name: Disposable production lifecycle smoke (no Google or ACME)
        env:
          PROSEPECT_DISPOSABLE_CI: "yes"
        run: timeout 40m bash scripts/personal/smoke.sh

  end-to-end:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: prosepect
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d prosepect"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/prosepect
      APP_ENV: development
      ALLOW_INSECURE_DEV_AUTH: "true"
      # Disposable end-to-end service only; hosted defaults remain disabled.
      GROUPS_ENABLED: "true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Start API
        run: |
          cargo run -p prosepect-api --bin prosepect-api > /tmp/prosepect-api.log 2>&1 &
          api_pid=$!
          for attempt in {1..300}; do
            if curl --fail --silent http://127.0.0.1:3000/ready; then
              exit 0
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat /tmp/prosepect-api.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/prosepect-api.log
          exit 1
      - run: npm run test:e2e
      - name: Production browser security policies
        working-directory: apps/web
        run: npx playwright test --config playwright.security.config.ts
